# Default values for resume-builder-ui.

replicaCount: 1

image:
  repository: aruna451/resume-builder-ui
  tag: latest   # pin to a commit SHA (e.g. $CI_COMMIT_SHORT_SHA) — see note in deployment.yaml
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

containerPort: 80

service:
  port: 80
  targetPort: 80
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  path: /
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20

# Ingress for the UI's catch-all "/" route only. The API's "/api" and
# "/oauth2" routes live in the separate resume-builder-api chart/release —
# nginx merges multiple Ingress objects that share the same
# ingressClassName, so both coexist on the same host fine.
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"   # flip to "true" once you have TLS
  paths:
    - path: /
      pathType: Prefix
  tls: []
    # - secretName: resume-builder-tls
    #   hosts:
    #     - resume-builder.example.com
