apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resume-builder-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resume-builder-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "resume-builder-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resume-builder-ui.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ui
          # Pin .Values.image.tag to a commit SHA, not :latest, so ArgoCD can
          # detect new builds and you can roll back. CI should tag+push as
          # <ecr-repo>:$CI_COMMIT_SHORT_SHA and bump this value (or use
          # ArgoCD Image Updater to automate it).
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
