apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resume-builder-db.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resume-builder-db.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
