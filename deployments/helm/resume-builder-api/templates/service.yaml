apiVersion: v1
kind: Service
metadata:
  name: {{ include "resume-builder-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resume-builder-api.labels" . | nindent 4 }}
  {{- if .Values.service.annotations }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "resume-builder-api.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
