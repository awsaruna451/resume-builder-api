apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    # Was missing the "arn:aws:iam::" prefix — as written before, IRSA would
    # silently fail to assume the role and ESO couldn't reach Secrets Manager.
    eks.amazonaws.com/role-arn: "arn:aws:iam::324037296112:role/tf-practice-dev-eso-role"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets